name: Validate Skills Marketplace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.207

      - name: Validate Claude marketplace
        run: claude plugin validate . --strict

      - name: Validate repository contracts
        shell: pwsh
        run: ./scripts/validate-repository.ps1

      - name: Test repository contract regressions
        shell: pwsh
        run: ./scripts/test-repository-contracts.ps1
