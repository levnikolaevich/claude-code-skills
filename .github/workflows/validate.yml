name: Validate Skills Marketplace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.287

      - name: Validate Claude marketplace
        run: claude plugin validate . --strict

      - name: Validate repository contracts
        shell: pwsh
        run: ./scripts/validate-repository.ps1

      - name: Test repository contract regressions
        shell: pwsh
        run: ./scripts/test-repository-contracts.ps1

      - name: Test Codex eval evidence regressions
        shell: pwsh
        run: ./scripts/test-codex-eval-runner.ps1

      - name: Validate maintainer mod and its allowed calls
        run: |
          report=$(claude plugin validate .claude/skills/ln-maintainer --strict)
          echo "$report"
          calls=$(grep -E 'register\.tsx calls:' <<<"$report" || true)
          [ -n "$calls" ] || { echo "::error::The validator did not list the maintainer mod's calls."; exit 1; }
          if grep -Eq '\$\.(agent|model|prompt)\.|\$\.tool\.register' <<<"$calls"; then
            echo "::error::The maintainer mod may not orchestrate agents, submit prompts, call models or register tools."
            exit 1
          fi

      - name: Test maintainer mod
        run: claude plugin test .claude/skills/ln-maintainer
